server {
    listen 127.0.0.1:8080 default_server;
    server_name meshlink.spp.lol;
    root /var/www/meshlink;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;
    access_log off;
    # Only the local Cloudflare connector can reach this listener.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Only the portal routes reach PocketBase through the tunnel.
    # Database administration, settings, raw collections and ingestion stay local.
    # The public demo uses a separate synthetic database and OS account.
    location ~ ^/demo-api/api/meshlink/worker(?:/|$) { return 404; }
    location ~ ^/demo-api/api/(?:meshlink/|collections/accounts/auth-with-password$|health$) {
        rewrite ^/demo-api(/api/.*)$ $1 break;
        proxy_pass http://127.0.0.1:8092;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /demo-api/ { return 404; }
    location ~ ^/api/meshlink/worker(?:/|$) { return 404; }
    location ~ ^/api/(?:meshlink/|collections/accounts/auth-with-password$|health$) {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /api/ { return 404; }
    location /_/ { return 404; }
    location ~ /\. { return 404; }
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }
}
