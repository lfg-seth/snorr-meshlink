name: Historical tracking schema validation

on:
  push:
    branches: [main]
    paths: ['.github/tracking.json', '.github/workflows/tracking-setup.yml', 'scripts/github/bootstrap-tracking.py']
  pull_request:
    paths: ['.github/tracking.json', '.github/workflows/tracking-setup.yml', 'scripts/github/bootstrap-tracking.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracking-setup
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: python3 scripts/github/bootstrap-tracking.py
