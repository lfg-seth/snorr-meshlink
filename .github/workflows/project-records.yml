name: Project record checks

on:
  push:
    branches: [main]
    paths: ['AGENTS.md', 'PROJECT.md', 'README*.md', '.scratch/**', 'docs/**', 'records/**', 'scripts/check-project.py', 'scripts/tests/**', 'scripts/README.md', '.github/workflows/project-records.yml']
  pull_request:
    paths: ['AGENTS.md', 'PROJECT.md', 'README*.md', '.scratch/**', 'docs/**', 'records/**', 'scripts/check-project.py', 'scripts/tests/**', 'scripts/README.md', '.github/workflows/project-records.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-records-${{ github.ref }}
  cancel-in-progress: true

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: backend/.python-version
      - run: python -m unittest discover -s scripts/tests -v
      - name: Check changed records and links
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python scripts/check-project.py docs --base "$CHECK_BASE"
