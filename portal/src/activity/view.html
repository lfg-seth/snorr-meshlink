<style>
:host { display:block; --ice:light-dark(#126079,#a8ecff);
  font:14px/1.4 Inter,"Segoe UI",sans-serif; color:var(--text); background:var(--page); }
* { box-sizing:border-box; }
h1, h2, h3, p, dl, dd { margin:0; }
main { max-width:112rem; margin:auto; padding:clamp(15px,2.5vw,40px); }
header, .identity, .topline, .heard, .section-label, .statusline { display:flex; align-items:center; gap:9px; }
header, .topline, .heard, .section-label { justify-content:space-between; }
header { flex-wrap:wrap; margin-bottom:22px; }
.identity { gap:13px; }
.identity svg { width:45px; height:45px; background:var(--good-bg); border:1px solid var(--border); border-radius:11px; padding:8px; color:var(--good-text); }
.brand, .section-label, .eyebrow { font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
h1 { font-size:clamp(25px,3vw,34px); line-height:1.15; letter-spacing:-.04em; }
.statusline { flex-wrap:wrap; color:var(--muted); font-size:12px; }
#status { color:var(--tone); font-weight:650; }
.dot::before { content:""; display:inline-block; width:.57em; height:.57em; border-radius:50%; background:var(--tone); margin-right:.5em; vertical-align:.1em; }
.all { --tone:var(--info-text); } .reporting,.fresh { --tone:var(--good-text); } .attention,.aging { --tone:var(--warning-text); }
.silent,.stale,.down { --tone:var(--danger-text); } .unknown,.event { --tone:var(--muted); }
#summary { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; margin-bottom:22px; }
button { font:inherit; color:inherit; cursor:pointer; }
.stat { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:3px 8px; text-align:left;
  background:var(--surface); border:1px solid var(--border); border-radius:7px; padding:10px 14px; }
.stat span { font-size:12px; font-weight:600; color:var(--muted); }
.stat strong { color:var(--tone); font-size:26px; line-height:1.1; font-variant-numeric:tabular-nums; }
.stat[aria-pressed=true] { border-color:var(--tone); }
.stat:hover, summary:hover { background:var(--hover); }
:focus-visible { outline:2px solid var(--ice); outline-offset:3px; }
#cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,410px),1fr)); gap:12px; align-items:stretch; }
article { min-width:0; background:linear-gradient(130deg,color-mix(in srgb,var(--tone) 10%,var(--surface)),var(--surface) 82%);
  border:1px solid color-mix(in srgb,var(--tone) 32%,var(--border)); border-top:3px solid var(--tone); border-radius:8px;
  padding:14px 16px 16px; }
h2 { font-size:22px; letter-spacing:-.035em; overflow-wrap:anywhere; line-height:1.2; }
.badge { color:var(--tone); border:1px solid color-mix(in srgb,var(--tone) 38%,transparent);
  background:color-mix(in srgb,var(--tone) 8%,transparent); border-radius:20px; padding:2px 7px; font-size:11px; font-weight:700; white-space:nowrap; }
.heard { color:var(--muted); font-size:12px; margin:6px 0 12px; min-height:18px; }
.rx { color:var(--ice); font-weight:650; font-size:11px; }
.metrics,.tiles { display:grid; gap:6px; }
.metrics { grid-template-columns:repeat(var(--columns,3),minmax(0,1fr)); }
.tiles { grid-template-columns:repeat(3,minmax(0,1fr)); }
.metric,.timer { position:relative; min-width:0; overflow:hidden; border-radius:7px; padding:7px 8px 10px; background:var(--subtle); }
.metric span,.timer span,.age { display:block; font-size:11px; color:var(--muted); overflow-wrap:anywhere; }
.metric b,.timer b { display:block; color:var(--tone); font-size:15px; font-variant-numeric:tabular-nums; }
.metrics b { font-size:clamp(15px,1.2vw,20px); }
.metric b small { font-size:11px; margin-left:2px; }
.track { position:absolute; bottom:3px; left:7px; right:7px; height:3px; border-radius:4px; overflow:hidden; background:var(--border); }
.track i { display:block; height:100%; background:var(--tone); }
.signed::after { content:""; position:absolute; top:0; bottom:0; left:50%; border-left:1px solid var(--muted); }
.controls { display:flex; align-items:center; gap:6px; border-top:1px solid var(--border); padding-top:10px; margin:12px 0 8px; }
.controls button { border-radius:18px; background:var(--surface); border:1px solid var(--control-border); padding:4px 11px; font-size:12px; color:var(--muted); }
.controls button[aria-pressed=true] { color:var(--text); background:var(--selected); border-color:var(--accent); }
.reason { margin-left:auto; color:var(--tone); font-size:12px; }
.empty { color:var(--muted); font-size:12px; grid-column:1/-1; }
@media(max-width:380px) { .metrics,.tiles { grid-template-columns:repeat(2,minmax(0,1fr)); } }
.incoming { animation:receive 1.4s ease-out 1; }
@keyframes receive { from { box-shadow:inset 0 0 0 2px var(--ice),0 0 8px #9be8ff35; } to { box-shadow:inset 0 0 0 2px transparent; } }
@media (prefers-reduced-motion:reduce) { .incoming { animation:none; } }
@media(max-width:680px) { #summary { gap:4px; margin-bottom:14px; } .stat { flex-direction:column-reverse; align-items:start; padding:7px 5px; }
  .stat span { font-size:10px; } .stat span::before { display:none; } .stat strong { font-size:21px; } header { margin-bottom:14px; } }
</style>
<main>
<header><div class="identity"><svg viewBox="0 0 28 28" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M1 16h6l4-10 5 17 4-11 2 4h5"/></svg>
<div><div class="brand">SNORR MeshLink</div><h1>Node activity</h1></div></div>
<div class="statusline"><span id="status" class="dot unknown">Connecting</span><time id="stamp"></time></div></header>
<nav id="summary" aria-label="Filter nodes by reporting status"></nav>
<section id="cards" aria-label="Nodes"></section>
<noscript>Enable JavaScript to see live node activity.</noscript>
</main>
